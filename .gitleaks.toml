# gitleaks configuration (used by .githooks/pre-commit).
title = "triad"

[extend]
useDefault = true

[[allowlists]]
description = "Recorded public testnet data: Telegraph receipts, signal hashes, transaction hashes and live Intent schemas"
paths = ['''docs/results/.*\.json$''', '''benchmark/.*\.jsonl?$''']

[[allowlists]]
description = "EVM addresses (20 bytes) are public. A private key is 32 bytes and still matches."
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']
